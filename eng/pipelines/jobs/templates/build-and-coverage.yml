# Build and test the AzureCommunicationUICalling Swift package and create a test coverage report

parameters:
  - name: simulator
    type: string
    default: 'iPhone 16'

steps:
  # AzureCommunicationCalling 3.x binaries are built with Swift 6.3 (Xcode 26.4), older toolchains cannot read them.
  - script: |
      set -euo pipefail
      xcodebuild -version
      swift --version
      XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
      if [ "$(printf '%s\n' 26.4 "$XCODE_VERSION" | sort -V | head -1)" != "26.4" ]; then
        echo "##vso[task.logissue type=error]Xcode 26.4 or later is required to build AzureCommunicationUICalling."
        exit 1
      fi
    displayName: "Check Xcode version"

  - template: install-swiftlint.yml

  - script: swiftlint
    workingDirectory: AzureCommunicationUI
    displayName: "SwiftLint Manual Pre-Check"

  - script: |
      set -euo pipefail
      swiftlint lint --strict --config ../../.swiftlint.yml Sources
      swiftlint lint --strict --config ../../.swiftlint-tests.yml Tests
    workingDirectory: AzureCommunicationUI/sdk/AzureCommunicationUICalling
    displayName: "SwiftLint AzureCommunicationUICalling (strict)"

  - script: |
      swift build -v \
        -Xswiftc "-sdk" \
        -Xswiftc "`xcrun --sdk iphonesimulator --show-sdk-path`" \
        -Xswiftc "-target" \
        -Xswiftc "x86_64-apple-ios16.0-simulator"
      xcodebuild test -scheme AzureCommunicationUICommon -sdk "`xcrun --sdk iphonesimulator --show-sdk-path`" -destination "name=${{ parameters.simulator }}"
    workingDirectory: AzureCommunicationUI/sdk/AzureCommunicationUICommon
    displayName: "Build and test AzureCommunicationUICommon"

  - script: |
      set -euo pipefail
      xcodebuild build \
        -scheme AzureCommunicationUICalling \
        -configuration Release \
        -destination "generic/platform=iOS" \
        -derivedDataPath "$(Agent.TempDirectory)/DerivedDataRelease"
    displayName: "Build AzureCommunicationUICalling package (Release, iphoneos)"

  - script: |
      set -euo pipefail
      xcodebuild test \
        -scheme AzureCommunicationUICalling \
        -configuration Debug \
        -destination "platform=iOS Simulator,name=${{ parameters.simulator }}" \
        -derivedDataPath "$(Agent.TempDirectory)/DerivedData" \
        -enableCodeCoverage YES \
        -resultBundlePath "$(Agent.TempDirectory)/AzureCommunicationUICalling.xcresult"
    displayName: "Unit test AzureCommunicationUICalling package"

  - script: |
      set -euo pipefail
      DERIVED_DATA="$(Agent.TempDirectory)/DerivedData"
      PROFDATA=$(find "$DERIVED_DATA/Build/ProfileData" -name Coverage.profdata | head -1)
      TEST_BINARY="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AzureCommunicationUICallingTests.xctest/AzureCommunicationUICallingTests"
      # Same exclusions as the former slather configuration.
      IGNORE='(/Tests/|/SourcePackages/|/checkouts/|/DerivedSources/|(Button|Cell|View|Controller)\.swift$)'
      xcrun llvm-cov report -instr-profile "$PROFDATA" "$TEST_BINARY" -ignore-filename-regex="$IGNORE" | tail -1
      xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" "$TEST_BINARY" -ignore-filename-regex="$IGNORE" \
        > "$(System.ArtifactsDirectory)/calling-coverage.lcov"
    displayName: "Export AzureCommunicationUICalling code coverage"

  - script: |
      set -euo pipefail
      xcodebuild build \
        -workspace AzureCommunicationUI/AzureCommunicationUI.xcworkspace \
        -scheme AzureCommunicationUIDemoApp \
        -configuration Debug \
        -destination "generic/platform=iOS Simulator" \
        -derivedDataPath "$(Agent.TempDirectory)/DerivedDataDemo"
    displayName: "Build AzureCommunicationUIDemoApp"
